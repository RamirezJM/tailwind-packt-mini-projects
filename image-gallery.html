  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <title>Image Gallery</title>

<body>

  <main class="flex flex-col items-center justify-center bg-sky-100 min-h-screen">
    <section class="flex flex-col gap-8 bg-neutral-200 max-w-3xl h-screen shadow-md py-12 px-24 ">
      <nav>
        <ul class="flex justify-center md:justify-end items-center gap-4 font-medium text-sm">
          <li class="hover:border-b-2"><a href="#">Vector</a></li>
          <li class="hover:border-b-2"><a href="#">Illustrations</a></li>

        </ul>

          <span>🔍</span>
        </form>

        <button class="bg-black rounded-lg py-2 px-6 text-sm text-white hover:bg-white hover:text-black">Upload</button>
      </section>

        <div class="aspect-[3/2] group">

              <p class="text-sm italic">Painting</p>
