<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <title>Login modal</title>
</head>

<body>

  <main class="flex flex-col items-center justify-center bg-pink-100 min-h-screen">
    <section class="flex bg-white max-w-3xl my-12 rounded-lg shadow-lg">
      <div class="flex flex-col gap-3 p-12 flex-3">
        <h1 class="font-serif font-extrabold text-xl">Log in</h1>
        <p class="text-zinc-500">Log into your account to upload or download pictures, video or music.</p>
        <input type="email" placeholder="Enter yor email address"
          class="p-2 w-100 border border-gray-300 rounded-md mt-6 hover:border-sky-600 hover:shadow-sm">
        <div class="flex justify-between items-center">
          <p class="text-sky-600">Forgot password?</p>
          <button
            class="bg-blue-500 text-white py-3 px-7 rounded-md hover:bg-blue-700 hover:-translate-y-0.5">Next</button>
        </div>
        <hr class="my-4 border border-gray-300">
        <p class="text-center text-zinc-500">Or login in with</p>
        <div class="flex justify-center gap-4">
          <button class="px-5 py-1 border border-gray-300 rounded-md flex items-center justify-between 
            hover:-translate-y-1 hover:bg-neutral-50 hover-shadow-sm">
            <img src="images/facebook.png" alt="" class="w-8 me-3">
            Facebook
          </button>
          <button class="flex items-center justify-between py-1 px-5 border border-gray-300 rounded-md
          hover:-translate-y-1 hover:bg-neutral-50 hover-shadow-sm">
            <img src="images/google.png" alt="" class="w-8 me-3">
            Google
          </button>
        </div>
      </div>
      <div class="aspect-[1/2] flex-2 rounded-r-lg relative">
        <img src="images/image.jpg" alt="" class="h-full rounded-r-lg">
        <span class="size-6 rounded-full absolute top-0 right-0 bg-white">✖</span>
      </div>
    </section>
  </main>
</body>

</html>
