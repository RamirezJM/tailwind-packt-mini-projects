<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <title>Email Subscriber</title>
</head>

<body>
  <main class="flex items-center justify-center min-h-screen bg-stone-800 p-8">

    <article class="flex flex-col md:flex-row md:max-h-80 bg-zinc-900 rounded-xl p-4 mx-8">
      <div class="aspect-square md:aspect-[4/5] overflow-hidden">
        <img src="images/email-subscribe.jpg" alt=""
          class="size-full object-cover object-center rounded-t-xl md:rounded-l-xl md:rounded-r-none hover:scale-103">
      </div>
      <div class="flex flex-col align-center justify-center m-12 max-w-lg">
        <h1 class="text-4xl font-medium font-serif text-white">Get diet and fitness tips in your inbox</h1>
        <p class="mt-6 font-medium text-lg text-white">Eat better and exercise better. Sign up for the Diet&Fitness
          newsletter.</p>
        <form class="flex flex-col md:flex-row gap-4 mt-6 w-full">
          <input type="email" id="email" placeholder="Enter your email address"
            class="border border-stone-400 rounded-md p-2 text-center md:text-start flex-1 text-gray-500">
          <button class="bg-lime-400 rounded-md p-2">Subscribe</button>
        </form>
      </div>
    </article>
  </main>

</body>

</html>
